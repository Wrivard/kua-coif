name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs of the same ref. Saves CI minutes when pushing fast.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build · typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Loop 41 — switched from npm to pnpm because local dev uses
      # pnpm (`pnpm add` only updates pnpm-lock.yaml) and the parallel
      # `package-lock.json` was constantly drifting out of sync,
      # making `npm ci` fail. Single source of truth = pnpm-lock.yaml.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (Vitest)
        # Pin TZ so date-fns-tz shop-timezone math is reproducible — CI runners
        # default to UTC; local dev may differ. (Roadmap Wave 0)
        env:
          TZ: America/Toronto
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build (Next.js)
        # Provide harmless placeholders so middleware/auth init doesn't blow up
        # when env vars are absent. Real values live only in Vercel + local .env.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: pnpm build
