name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs of the same ref. Saves CI minutes when pushing fast.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build · typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Loop 41 — switched from npm to pnpm because local dev uses
      # pnpm (`pnpm add` only updates pnpm-lock.yaml) and the parallel
      # `package-lock.json` was constantly drifting out of sync,
      # making `npm ci` fail. Single source of truth = pnpm-lock.yaml.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No `version` input: the action reads package.json's packageManager pin
        # (pnpm@9.15.0). Specifying BOTH errors with "Multiple versions of pnpm
        # specified" and killed every job at setup (red CI from d68e1fa).

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (Vitest)
        # Pin TZ so date-fns-tz shop-timezone math is reproducible — CI runners
        # default to UTC; local dev may differ. (Roadmap Wave 0)
        env:
          TZ: America/Toronto
        run: pnpm test

      - name: Test timezone helpers under UTC runtime
        # The main test run pins TZ=America/Toronto for reproducibility — which
        # also MASKS runtime-TZ bugs (prod serverless runs UTC). This leg
        # re-runs the timezone suite under UTC so a runtime-dependent helper
        # fails loudly here instead of shipping.
        env:
          TZ: UTC
        run: pnpm vitest run lib/business/timezone.test.ts

      - name: Test (Vitest) — FULL suite under UTC runtime
        # Plan 016 step 3: extends the targeted UTC leg above to the WHOLE
        # suite, so a runtime-TZ-dependent test anywhere (not just timezone.*)
        # surfaces here rather than in UTC prod. NON-BLOCKING for its first
        # week as a flake hedge; the full suite already passed locally under
        # TZ=UTC (171/171), so promotion to required should be quick — drop
        # continue-on-error once it has a green track record (see plan 016).
        continue-on-error: true
        env:
          TZ: UTC
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build (Next.js)
        # Provide harmless placeholders so middleware/auth init doesn't blow up
        # when env vars are absent. Real values live only in Vercel + local .env.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: pnpm build
